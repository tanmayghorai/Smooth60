<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Smooth60 app icon (Icon A, Frame Trail) on Apple's macOS icon grid:
       824×824 rounded square centred in a 1024 canvas, with a soft drop shadow. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0B0F14" filter="url(#shadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <!-- the 512-unit artwork, scaled into the 824 square -->
  <g transform="translate(100 100) scale(1.609375)">
    <g transform="translate(45 0) skewX(-10)">
      <rect x="96" y="171" width="170" height="170" rx="30" fill="#38E1FF" opacity="0.32"/>
      <rect x="171" y="171" width="170" height="170" rx="30" fill="none" stroke="#38E1FF" stroke-width="10" stroke-dasharray="22 14" opacity="0.9"/>
      <rect x="246" y="171" width="170" height="170" rx="30" fill="#38E1FF"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
